name: Deploy Frontend

on:
  push:
    branches: [main, master]
  repository_dispatch:
    types: [cms-deploy]
  workflow_dispatch:

concurrency:
  group: deploy-ncyimby-frontend
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Strapi is reachable
        run: |
          for i in $(seq 1 6); do
            if curl -sf "$STRAPI_URL/api/articles" > /dev/null 2>&1; then
              echo "Strapi is reachable"
              exit 0
            fi
            echo "Attempt $i/6 — waiting 10s..."
            sleep 10
          done
          echo "::warning::Strapi unreachable at $STRAPI_URL — building without CMS content"
        env:
          STRAPI_URL: ${{ vars.STRAPI_URL }}

      - name: Build Gatsby site
        run: npm run build
        env:
          STRAPI_URL: ${{ vars.STRAPI_URL }}
          GATSBY_STRAPI_URL: ${{ vars.GATSBY_STRAPI_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy CloudFront URL rewrite function
        run: |
          FUNC_NAME="ncyimby-url-rewrite"

          if aws cloudfront describe-function --name "$FUNC_NAME" 2>/dev/null; then
            ETAG=$(aws cloudfront describe-function --name "$FUNC_NAME" \
              --query 'ETag' --output text)
            aws cloudfront update-function \
              --name "$FUNC_NAME" \
              --if-match "$ETAG" \
              --function-config '{"Comment":"Rewrite clean URLs to index.html","Runtime":"cloudfront-js-2.0"}' \
              --function-code fileb://infra/url-rewrite.js
            ETAG=$(aws cloudfront describe-function --name "$FUNC_NAME" \
              --query 'ETag' --output text)
            aws cloudfront publish-function \
              --name "$FUNC_NAME" \
              --if-match "$ETAG"
          else
            aws cloudfront create-function \
              --name "$FUNC_NAME" \
              --function-config '{"Comment":"Rewrite clean URLs to index.html","Runtime":"cloudfront-js-2.0"}' \
              --function-code fileb://infra/url-rewrite.js
            ETAG=$(aws cloudfront describe-function --name "$FUNC_NAME" \
              --query 'ETag' --output text)
            aws cloudfront publish-function \
              --name "$FUNC_NAME" \
              --if-match "$ETAG"
          fi

          FUNC_ARN=$(aws cloudfront describe-function --name "$FUNC_NAME" \
            --query 'FunctionSummary.FunctionMetadata.FunctionARN' --output text)
          DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"

          HAS_FUNC=$(aws cloudfront get-distribution-config --id "$DIST_ID" \
            --query "DistributionConfig.DefaultCacheBehavior.FunctionAssociations.Items[?FunctionARN=='$FUNC_ARN']" \
            --output text 2>/dev/null || true)

          if [ -z "$HAS_FUNC" ] || [ "$HAS_FUNC" = "None" ]; then
            echo "::warning::CloudFront Function created but not yet associated with distribution."
            echo "Run once manually: associate function ARN $FUNC_ARN with the default cache behavior (viewer-request)."
          else
            echo "CloudFront Function already associated."
          fi

      - name: Deploy to S3 and invalidate CloudFront
        run: |
          aws s3 sync public/ s3://${{ secrets.FRONTEND_S3_BUCKET }} --delete \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp public/ s3://${{ secrets.FRONTEND_S3_BUCKET }}/ \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --include "sw.js" \
            --include "*.webmanifest" \
            --include "page-data/*.json" \
            --include "page-data/**/*.json" \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=0, must-revalidate"

          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
