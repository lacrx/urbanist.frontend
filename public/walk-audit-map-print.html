<!DOCTYPE html>
<html>
<head>
<title>Walk Audit Map - Print</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: white; }
  .map {
    width: 100%;
    height: 100vh;
    border: none;
  }
  @media print {
    html, body { height: 100%; }
    .map {
      height: 100%;
      width: 100%;
      page-break-after: always;
    }
    @page {
      size: letter portrait;
      margin: 0.15in;
    }
  }
  @media screen {
    .hint {
      text-align: center;
      padding: 0.5rem;
      font-family: sans-serif;
      font-size: 0.8rem;
      color: #999;
      background: #f5f5f5;
    }
  }
  @media print {
    .hint { display: none; }
  }
</style>
</head>
<body>
<div class="hint">Ctrl+P / Cmd+P to print. Two maps per page, no margins.</div>
<iframe class="map" src="https://www.google.com/maps/d/u/0/embed?mid=1FuU8sNqgb8aM1XqoUEZefaRdBAdDoMQ&ll=33.226310052480635,-117.32928&z=17"></iframe>
<iframe class="map" src="https://www.google.com/maps/d/u/0/embed?mid=1FuU8sNqgb8aM1XqoUEZefaRdBAdDoMQ&ll=33.226310052480635,-117.32928&z=17"></iframe>
</body>
</html>
